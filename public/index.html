<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>熊谷热 · 狼夜</title><style>
:root{color-scheme:dark;--gold:#d7b66b;--muted:#aaa;--panel:#1b1b1b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#392b16,#121212 55%,#090909);color:#f5f0e7;font-family:system-ui,'Noto Sans SC',sans-serif;min-height:100vh}main{max-width:620px;margin:auto;padding:38px 18px 80px}.crest{margin:auto;width:110px;height:110px;border:2px solid var(--gold);border-radius:50%;display:grid;place-content:center;font-size:48px;background:#1c1710;box-shadow:0 0 60px #b68a3526}.crest img{width:95px;height:95px;object-fit:contain}.kicker{text-align:center;letter-spacing:3px;color:var(--gold);font-size:12px;margin-top:20px}h1{text-align:center;font-size:40px;letter-spacing:6px;margin:8px 0}h2{font-size:20px;color:var(--gold)}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}.panel{background:linear-gradient(125deg,#222,#141414);padding:21px;border:1px solid #6a5029;border-radius:16px;margin:18px 0;box-shadow:0 12px 30px #0006}input{width:100%;border:1px solid #614b29;border-radius:10px;background:#0c0c0c;color:white;padding:14px;font-size:16px;margin:7px 0 12px}button{border:1px solid #d9b86c;background:linear-gradient(120deg,#d9b86c,#99702f);color:#16110a;border-radius:10px;padding:13px 17px;font-size:15px;font-weight:800;cursor:pointer;min-height:46px}button.alt{color:var(--gold);background:#1a1a1a}button:disabled{opacity:.4;cursor:not-allowed}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons>*{flex:1}.hidden{display:none!important}.tiny{font-size:12px;color:#aaa}.code{text-align:center;color:var(--gold);font-size:42px;font-weight:900;letter-spacing:9px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.player{padding:12px;border:1px solid #52412b;border-radius:9px;background:#141414;font-size:14px}.dead{opacity:.45;text-decoration:line-through}.tag{font-size:11px;color:var(--gold)}.role{text-align:center;background:#0d0d0d;border:1px solid #ad8c4a;padding:23px;border-radius:10px;font-size:29px;color:var(--gold);margin:12px 0}.log{max-height:210px;overflow:auto;line-height:1.8;font-size:13px;color:#bfb9ad}.vote{margin:5px;padding:10px}.footer{margin-top:34px;text-align:center;color:#766b59;font-size:11px}#notice{color:#ff9999;min-height:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}#hostSelect{margin-top:8px}select{background:#121212;color:white;border:1px solid #9a7b42;padding:12px;border-radius:8px;max-width:100%}
</style></head><body><main><div class="crest"><img src="logo.png" onerror="this.style.display='none';this.parentNode.append('🐻')" alt="熊谷热 Logo"></div><div class="kicker">KUMAGAYA HOT MOTO CLUB</div><h1>狼 夜</h1><div class="sub">俱乐部专属 · 线下聚会狼人杀</div><div id="notice" role="alert"></div>
<section id="entry" class="panel"><h2>加入狼夜</h2><label>你的昵称<input id="name" maxlength="18" placeholder="例如：阿强"></label><label>房间号（加入房间时填写）<input id="code" inputmode="numeric" maxlength="6" placeholder="6位房间号"></label><div class="buttons"><button id="create">创建房间</button><button class="alt" id="join">加入房间</button></div><p class="tiny">支持6–12人。第一版为线下主持版，玩家各自用手机看身份、投票。</p></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><span class="tag">房间号码</span><span id="phase" class="tag">等待中</span></div><div id="roomCode" class="code"></div><div class="buttons"><button class="alt" id="share">复制邀请链接</button></div><p class="tiny" id="round"></p></div><div class="panel"><h2>你的身份</h2><div class="role" id="role">等待发牌</div><p class="tiny">身份只会显示在你自己的设备上。不要让其他玩家看到。</p></div><div class="panel"><div class="row"><h2>玩家名单</h2><span id="count" class="tag"></span></div><div id="players" class="players"></div></div><div class="panel hidden" id="voting"><h2>白天投票</h2><p class="tiny">选择你要放逐的玩家，每位存活玩家仅可投票一次。</p><div id="voteOptions"></div><button class="alt" id="abstain">弃票</button><p class="tiny" id="voteProgress"></p></div><div class="panel hidden" id="hostPanel"><h2>房主控制台</h2><p class="tiny">夜间身份技能由线下主持人引导，房主负责公布死亡信息和切换阶段。</p><div class="buttons"><button id="start">开始游戏 / 随机发牌</button><button id="next">下一阶段</button><button class="alt" id="restart">重新开局</button></div><div id="eliminatePanel"><p class="tiny">夜晚技能结束后，标记出局玩家（如果有人出局）</p><select id="hostSelect"></select> <button class="alt" id="eliminate">标记出局</button></div></div><div class="panel"><h2>游戏记录</h2><div id="log" class="log"></div></div></section><div class="footer">KUMAGAYA HOT MC · PRIVATE CLUB GAME · MVP</div></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();let room=null,my=null;const notice=msg=>{$('notice').textContent=msg;setTimeout(()=>{$('notice').textContent=''},5000)};
const qs=new URLSearchParams(location.search);if(qs.get('room'))$('code').value=qs.get('room');
function enter(code){$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=code;history.replaceState({},'',location.pathname+'?room='+code)}
$('create').onclick=()=>socket.emit('create',{name:$('name').value},res=>res.error?notice(res.error):enter(res.code));
$('join').onclick=()=>socket.emit('join',{name:$('name').value,code:$('code').value},res=>res.error?notice(res.error):enter(res.code));
$('share').onclick=()=>{const url=location.origin+location.pathname+'?room='+room.code;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>notice('邀请链接已复制')).catch(()=>notice(url));else prompt('复制邀请链接',url)};
$('start').onclick=()=>socket.emit('start');$('next').onclick=()=>socket.emit('next');$('restart').onclick=()=>{if(confirm('确定重新开局？'))socket.emit('restart')};
$('eliminate').onclick=()=>{if($('hostSelect').value&&confirm('确定将此玩家标记出局？'))socket.emit('eliminate',{target:$('hostSelect').value})};
$('abstain').onclick=()=>cast('abstain');function cast(target){socket.emit('vote',{target},res=>res?.error&&notice(res.error))}
socket.on('errorMessage',notice);socket.on('connect',()=>{if(room)notice('连接已恢复，但刷新或断线可能导致身份丢失。请房主重新开局。')});
socket.on('privateState',p=>{my=p;$('role').textContent=p.role||'等待发牌';if(!p.alive)$('role').textContent+=' · 已出局';render()});
socket.on('room',r=>{room=r;render()});
function render(){if(!room)return;const host=room.host===socket.id;const phaseName={lobby:'等待玩家',night:'黑夜',day:'白天讨论',vote:'投票中',finished:'游戏结束'};$('phase').textContent=phaseName[room.phase];$('round').textContent=room.round?`第 ${room.round} 轮`: '等待至少6人加入';$('count').textContent=`${room.players.length}/12`;$('players').innerHTML='';room.players.forEach(p=>{const d=document.createElement('div');d.className='player'+(!p.alive?' dead':'');d.textContent=p.name+(p.id===room.host?' ★房主':'')+(!p.alive?'（出局）':'');$('players').append(d)});$('log').replaceChildren(...room.log.map(s=>{const d=document.createElement('div');d.textContent='• '+s;return d}));$('hostPanel').classList.toggle('hidden',!host);$('start').disabled=room.phase!=='lobby';$('next').disabled=!['day','night'].includes(room.phase);$('restart').disabled=room.phase==='lobby';$('eliminatePanel').classList.toggle('hidden',!['night','day'].includes(room.phase));$('hostSelect').replaceChildren(...room.players.filter(p=>p.alive).map(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;return o}));$('voting').classList.toggle('hidden',room.phase!=='vote'||!my?.alive);$('voteProgress').textContent=`已投票 ${room.voteCount} / ${room.players.filter(p=>p.alive).length}`;$('voteOptions').replaceChildren(...room.players.filter(p=>p.alive).map(p=>{const b=document.createElement('button');b.className='alt vote';b.textContent=p.name;b.disabled=!!my?.hasVoted;b.onclick=()=>cast(p.id);return b}));$('abstain').disabled=!!my?.hasVoted;}
</script></body></html>
